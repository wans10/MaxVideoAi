# ==============================================================================
# MaxVideoAI — Nginx Reverse Proxy Configuration
#
# Features:
#   - HTTP → HTTPS redirect (with ACME challenge passthrough)
#   - SSL termination with Let's Encrypt certificates
#   - Reverse proxy to Next.js on port 3000
#   - Static asset caching (/_next/static/ → 1 year immutable)
#   - gzip compression
#   - Security headers
#   - WebSocket support
#   - Real IP handling (anti IP spoofing)
# ==============================================================================

worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ---- Performance ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- Security ----
    server_tokens off;

    # ---- Real IP (for accurate rate limiting and logging) ----
    # Docker internal network
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- Client limits ----
    client_max_body_size 50m;
    client_body_timeout 60s;

    # ---- gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---- Upstream ----
    upstream nextjs {
        server nextjs:3000;
        keepalive 32;
    }

    # ---- Map for WebSocket upgrade ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ====================================================================
    # HTTP server — redirect to HTTPS + serve ACME challenge
    # ====================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name video.llmhub.net;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ====================================================================
    # HTTPS server — main application
    # ====================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name video.llmhub.net;

        # ---- SSL certificates (Let's Encrypt) ----
        ssl_certificate     /etc/letsencrypt/live/video.llmhub.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/video.llmhub.net/privkey.pem;

        # ---- SSL hardening ----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ---- Security headers ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ---- Proxy settings ----
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Generous timeouts for long-running AI generation requests
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # ---- Static assets (immutable, 1-year cache) ----
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ---- Health check endpoints (suppress access log) ----
        location /api/health/ {
            proxy_pass http://nextjs;
            access_log off;
        }

        # ---- WebSocket / SSE support ----
        location /api/ {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---- Default: proxy all requests to Next.js ----
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
